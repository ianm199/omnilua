name: Publish omnilua (npm)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish --dry-run instead of publishing"
        required: true
        default: true
        type: boolean
      tag:
        description: "npm dist-tag"
        required: true
        default: "latest"
        type: choice
        options:
          - latest
          - next
  workflow_call:
    inputs:
      dry_run:
        required: true
        type: boolean
      tag:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish omnilua (npm)
    runs-on: ubuntu-latest
    steps:
      - name: require main branch or version tag
        run: |
          case "$GITHUB_REF" in
            refs/heads/main|refs/tags/v*) ;;
            *)
              echo "This workflow must run from main or a v* tag; got $GITHUB_REF" >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Publishing authenticates through npm trusted publishing (GitHub OIDC),
      # which needs npm 11.5.1 or later. The trusted publisher on npmjs.com is
      # bound to release.yml, so a direct dispatch of this workflow can only
      # dry-run.
      - name: npm with trusted publishing support
        run: npm install -g npm@11

      - uses: Swatinem/rust-cache@v2

      - name: verify package gate
        run: WASM_SKIP_BROWSER=1 ./harness/check_wasm_package.sh

      - name: npm publish dry-run
        if: ${{ inputs.dry_run }}
        working-directory: packages/omnilua
        run: npm publish --dry-run --access public --tag "${{ inputs.tag }}"

      - name: npm publish
        if: ${{ !inputs.dry_run }}
        working-directory: packages/omnilua
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          # Idempotent, matching the crates.io publish: skip if this version is
          # already on npm, so re-running a release does not fail on republish.
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "already on npm: $name@$version, skipping"
            exit 0
          fi
          if ! npm publish --provenance --access public --tag "${{ inputs.tag }}"; then
            echo "npm publish failed. If npm reported E404 or ENEEDAUTH, check the package's trusted publisher on npmjs.com: repository ianm199/omnilua, workflow release.yml, npm publish allowed." >&2
            exit 1
          fi

      - name: verify registry install
        if: ${{ !inputs.dry_run }}
        working-directory: packages/omnilua
        # Retry with backoff: a just-published version can take a short while to
        # propagate across the npm registry/CDN, and a single immediate install
        # would otherwise fail an already-successful publish (issue #80).
        run: |
          for attempt in 1 2 3 4 5; do
            if npm run test:registry; then
              exit 0
            fi
            echo "registry install attempt $attempt failed (likely propagation lag); retrying in $((attempt * 15))s" >&2
            sleep $((attempt * 15))
          done
          echo "registry install still failing after retries" >&2
          exit 1
